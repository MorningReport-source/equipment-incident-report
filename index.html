<style>
  @import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  .mast-inner {

  .mast .sub {

  /* ---- Cards / sections ---- */

  /* ---- Form ---- */

  input[type="text"], input[type="email"], input[type="date"], select, textarea {

  .kpi .v { font-family: 'IBM Plex Mono', monospace; font-size: 34px; font-weight: 500; line-height: 1; }
  .kpi .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: .05em;
    font-size: 13px; text-align: left; color: var(--ink-soft);

  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

  }
  .pill {

  .pill.Damaged { background: rgba(47,158,111,.15); color: #1d6b49; }

  .log-row td .meta { color: var(--ink-soft); font-size: 12px; }
  .log-thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 2px; border: 1px solid var(--line); cursor: pointer; }
  .empty { text-align: center; color: var(--ink-soft); padding: 40px 20px; font-size: 14px; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .toolbar input, .toolbar select { width: auto; }
  .link-btn { background: none; border: none; color: var(--steel); text-decoration: underline; cursor: pointer; font-size: 13px; }

  /* modal */
  .modal-bg {

</style>

<script>
(function () {
  const app = document.getElementById('app');
  let reports = [];
  let view = 'file';
  let toast = null;
  let isAdmin = false; // true when an admin is logged in via Supabase Auth

  const uid = () => 'IR-' + Date.now().toString(36).toUpperCase() + '-' +
    Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtDate = (d) => { try { return new Date(d + 'T00:00:00').toLocaleDateString('en-US',
    { month: 'short', day: 'numeric', year: 'numeric' }); } catch { return d; } };

  // ---- storage ----
  async function loadReports() {
    try {
      const { data, error } = await sb
        .from('incident_reports')
        .select('id, created_at, report')
        .order('created_at', { ascending: true });
      if (error) throw error;
      // Reports with no saved state (older rows) are treated as Open.
      reports = (data || []).map(row => Object.assign({ state: 'open' }, row.report, { dbId: row.id }));
    } catch (e) { console.error('load failed', e); reports = []; }
  }
  async function insertReport(record, photoData) {
    // No .select() here: under RLS, anonymous filers can INSERT but not SELECT,
    // so we must not ask for the row back.
    const { error } = await sb
      .from('incident_reports')
      .insert({ report: record, photo: photoData || null });
    if (error) throw error;
  }
  async function updateReport(dbId, record) {
    const payload = Object.assign({}, record);
    delete payload.dbId; // dbId is local only, not part of the stored report
    const { error } = await sb.from('incident_reports').update({ report: payload }).eq('id', dbId);
    if (error) throw error;
  }
  async function signIn(email, password) {
    const { error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if (error) throw error;
  }
  async function signOut() { try { await sb.auth.signOut(); } catch (e) { console.error(e); } }
  async function checkSession() {
    try { const { data } = await sb.auth.getSession(); isAdmin = !!(data && data.session); }
    catch (e) { isAdmin = false; }
  }
  async function deleteReport(dbId) {
    const { error } = await sb.from('incident_reports').delete().eq('id', dbId);
    if (error) throw error;
  }
  async function loadImage(reportId) {
    try {
      const rep = reports.find(r => r.id === reportId);
      if (!rep || rep.dbId == null) return null;
      const { data, error } = await sb
        .from('incident_reports')
        .select('photo')
        .eq('id', rep.dbId)
        .single();
      if (error) throw error;
      return data ? data.photo : null;
    } catch (e) { console.error('image load failed', e); return null; }
  }

  // ---- image compression ----
  function compressImage(file, cb) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const max = 1280;
        let { width: w, height: h } = img;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => cb(null);
      img.src = e.target.result;
    };
    reader.onerror = () => cb(null);
    reader.readAsDataURL(file);
  }

  // ================= RENDER =================
  function render() {
    app.innerHTML = `
      <div class="mast"><div class="mast-inner">
        <div>
          <h1>Non Vehicle Equipment Incident Report</h1>
          <div class="sub">S&amp;C Field Reporting &middot; Damaged / Lost / Stolen</div>
        </div>
        <div class="tabs">
          <button class="tab ${view==='file'?'active':''}" data-v="file">File a report</button>
          <button class="tab ${view==='metrics'?'active':''}" data-v="metrics">Reports &amp; metrics ${isAdmin ? '' : '&#128274;'}</button>
        </div>
      </div></div>
      <div class="wrap" id="content"></div>
      <div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>`;

    app.querySelectorAll('.tab').forEach(t =>
      t.onclick = () => { view = t.dataset.v; render(); });
    app.querySelector('#modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };

    if (view === 'file') renderForm();
    else if (!isAdmin) renderGate();
    else renderMetrics();
    if (toast) { showConfirm(toast); toast = null; }
  }

  // ---- ADMIN LOGIN (Supabase Auth) ----
  function renderGate() {
    const c = document.getElementById('content');
    c.innerHTML = `
      <div class="card" style="max-width:440px;margin:48px auto 0">
        <div class="card-head"><span class="num">&#128274;</span><h2>Admin sign in</h2></div>
        <div class="card-body">
          <p style="color:var(--ink-soft);margin:0 0 18px;font-size:14px">
            Reports &amp; metrics are limited to administrators. Sign in to continue.
          </p>
          <div class="field" style="margin-bottom:14px">
            <label for="f-email">Email</label>
            <input type="email" id="f-email" autocomplete="username" autofocus>
          </div>
          <div class="field" style="margin-bottom:16px">
            <label for="f-pass">Password</label>
            <input type="password" id="f-pass" autocomplete="current-password">
            <div class="err-text" id="err-login" style="display:none">Incorrect email or password.</div>
          </div>
          <div class="actions">
            <button class="btn btn-ghost" id="backBtn">Back to form</button>
            <button class="btn btn-primary" id="loginBtn">Sign in</button>
          </div>
        </div>
      </div>`;
    const emailEl = c.querySelector('#f-email');
    const passEl = c.querySelector('#f-pass');
    const errEl = c.querySelector('#err-login');
    const loginBtn = c.querySelector('#loginBtn');
    const tryLogin = async () => {
      errEl.style.display = 'none';
      const email = (emailEl.value || '').trim();
      const password = passEl.value || '';
      if (!email || !password) { errEl.textContent = 'Enter your email and password.'; errEl.style.display = 'block'; return; }
      loginBtn.disabled = true; loginBtn.textContent = 'Signing in…';
      try {
        await signIn(email, password);
        isAdmin = true;
        await loadReports();
        view = 'metrics';
        render();
      } catch (e) {
        loginBtn.disabled = false; loginBtn.textContent = 'Sign in';
        errEl.textContent = 'Incorrect email or password.';
        errEl.style.display = 'block';
        passEl.select();
      }
    };
    loginBtn.onclick = tryLogin;
    passEl.onkeydown = (e) => { if (e.key === 'Enter') tryLogin(); };
    c.querySelector('#backBtn').onclick = () => { view = 'file'; render(); };
  }

  // ---- FORM ----
  function renderForm() {
    const c = document.getElementById('content');
    c.innerHTML = `
      <div class="card">
        <div class="card-head"><span class="num">FORM</span><h2>Incident details</h2></div>
        <div class="card-body">
          <div class="field full" style="margin-bottom:16px">
            <label>Equipment status <span class="req">*</span></label>
            <div class="status-row" id="statusRow">
              ${STATUSES.map(s => `
                <label class="status-opt" data-s="${s}">
                  <input type="radio" name="status" value="${s}"><span>${s}</span>
                </label>`).join('')}
            </div>
            <div class="err-text" id="err-status" style="display:none">Select a status.</div>
          </div>

          <div class="grid">
            <div class="field">
              <label for="f-name">Employee name <span class="req">*</span></label>
              <input type="text" id="f-name" autocomplete="off">
              <div class="err-text" id="err-name" style="display:none">Required.</div>
            </div>
            <div class="field">
              <label for="f-date">Date of incident <span class="req">*</span></label>
              <input type="date" id="f-date">
              <div class="err-text" id="err-date" style="display:none">Required.</div>
            </div>
            <div class="field">
              <label for="f-sub">Subdivision <span class="req">*</span></label>
              <select id="f-sub">
                <option value="">— Select —</option>
                ${SUBDIVISIONS.map(s => `<option>${s}</option>`).join('')}
              </select>
              <div class="err-text" id="err-sub" style="display:none">Required.</div>
            </div>
            <div class="field">
              <label for="f-equip">Type of equipment <span class="req">*</span></label>
              <select id="f-equip">
                <option value="">— Select —</option>
                ${EQUIPMENT_TYPES.map(s => `<option>${s}</option>`).join('')}
              </select>
              <div class="err-text" id="err-equip" style="display:none">Required.</div>
            </div>
            <div class="field full">
              <label for="f-loc">Location incident occurred <span class="req">*</span></label>
              <input type="text" id="f-loc" placeholder="Yard, MP, crossing, address…" autocomplete="off">
              <div class="err-text" id="err-loc" style="display:none">Required.</div>
            </div>
            <div class="field full">
              <label for="f-summary">Summary of events <span class="req">*</span></label>
              <textarea id="f-summary" placeholder="What happened, in sequence."></textarea>
              <div class="err-text" id="err-summary" style="display:none">Required.</div>
            </div>
            <div class="field">
              <label for="f-sup">Reporting party's supervisor <span class="req">*</span></label>
              <input type="text" id="f-sup" autocomplete="off">
              <div class="err-text" id="err-sup" style="display:none">Required.</div>
            </div>
            <div class="field">
              <label for="f-supemail">Supervisor email <span style="text-transform:none;font-weight:400">(for notification)</span></label>
              <input type="email" id="f-supemail" placeholder="${NOTIFY_DEFAULT || 'name@company.com'}" autocomplete="off">
            </div>
            <div class="field full">
              <label>Photo of equipment / damage</label>
              <div class="drop" id="drop"><strong>Tap to add a photo</strong> &middot; or drag a file here</div>
              <input type="file" id="f-photo" accept="image/*" style="display:none">
              <div class="preview" id="preview"><img id="previewImg"><br><button type="button" id="removePhoto">Remove photo</button></div>
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-ghost" id="resetBtn">Clear</button>
            <button class="btn btn-primary" id="submitBtn">Submit report</button>
          </div>
          <div class="notice">Submitted reports are saved to a shared log visible to everyone who opens this tool, including supervisors reviewing metrics.</div>
        </div>
      </div>`;

    // photo handling
    let photoData = null;
    const drop = c.querySelector('#drop');
    const fileInput = c.querySelector('#f-photo');
    const preview = c.querySelector('#preview');
    const previewImg = c.querySelector('#previewImg');
    drop.onclick = () => fileInput.click();
    drop.ondragover = (e) => { e.preventDefault(); drop.style.borderColor = 'var(--steel)'; };
    drop.ondragleave = () => { drop.style.borderColor = ''; };
    drop.ondrop = (e) => { e.preventDefault(); drop.style.borderColor = ''; if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
    fileInput.onchange = () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); };
    c.querySelector('#removePhoto').onclick = () => { photoData = null; preview.style.display = 'none'; fileInput.value = ''; };
    function handleFile(f) {
      if (!f.type.startsWith('image/')) { alert('Please choose an image file.'); return; }
      drop.querySelector('strong').textContent = 'Processing…';
      compressImage(f, (d) => {
        drop.querySelector('strong').textContent = 'Tap to add a photo';
        if (!d) { alert('Could not read that image.'); return; }
        photoData = d; previewImg.src = d; preview.style.display = 'block';
      });
    }

    c.querySelector('#resetBtn').onclick = () => renderForm();

    c.querySelector('#submitBtn').onclick = async () => {
      const get = (id) => (document.getElementById(id).value || '').trim();
      const statusEl = c.querySelector('input[name="status"]:checked');
      const fields = {
        status: statusEl ? statusEl.value : '',
        name: get('f-name'), date: get('f-date'), subdivision: get('f-sub'),
        equipment: get('f-equip'), location: get('f-loc'), summary: get('f-summary'),
        supervisor: get('f-sup'), supervisorEmail: get('f-supemail')
      };
      const required = ['status','name','date','sub','equip','loc','summary','sup'];
      const map = { status:'status', name:'name', date:'date', sub:'subdivision', equip:'equipment', loc:'location', summary:'summary', sup:'supervisor' };
      let ok = true;
      required.forEach(k => {
        const val = fields[map[k]];
        const errEl = document.getElementById('err-' + k);
        const inputEl = document.getElementById('f-' + (k === 'status' ? '' : k));
        if (!val) { ok = false; errEl.style.display = 'block'; if (inputEl) inputEl.classList.add('invalid'); }
        else { errEl.style.display = 'none'; if (inputEl) inputEl.classList.remove('invalid'); }
      });
      if (!ok) return;

      const btn = c.querySelector('#submitBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      const id = uid();
      const record = { id, ...fields, state: 'open', note: '', hasPhoto: !!photoData, submittedAt: new Date().toISOString() };
      try {
        await insertReport(record, photoData);
        reports.push(record);
        toast = record;
        render();
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Submit report';
        let banner = c.querySelector('#saveError');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'saveError';
          banner.className = 'notice';
          banner.style.cssText = 'border-left-color:var(--stolen);color:var(--stolen);margin-top:14px';
          const actions = c.querySelector('.actions');
          if (actions) actions.after(banner); else c.appendChild(banner);
        }
        banner.innerHTML = "Couldn't save this report &mdash; the database didn't respond. Check your internet connection and try again. If it keeps happening, the Supabase connection settings may need a look.";
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    };

    // default date = today
    const today = new Date(); const off = today.getTimezoneOffset();
    document.getElementById('f-date').value = new Date(today - off * 60000).toISOString().slice(0, 10);
  }

  // ---- CONFIRMATION ----
  function showConfirm(rec) {
    const c = document.getElementById('content');
    const isRequest = rec.status === 'Request';
    // Incidents count toward repeat tracking; requests do not.
    const repeatCount = isRequest ? 0 : reports.filter(r => r.status !== 'Request' && normName(r.name) === normName(rec.name)).length;
    const notify = (NOTIFY_EMAIL || '').trim();
    // Requests go to the notification address; incidents go to the supervisor.
    // The notification address (Moore) is always included as a recipient.
    const primary = isRequest ? notify : (rec.supervisorEmail || '').trim();
    const recips = [];
    if (primary) recips.push(primary);
    if (notify && recips.indexOf(notify) === -1) recips.push(notify);
    if (isRequest) {
      REQUEST_NOTIFY_EMAILS.forEach(e => { e = (e || '').trim(); if (e && recips.indexOf(e) === -1) recips.push(e); });
    }
    if (!recips.length && NOTIFY_DEFAULT) recips.push(NOTIFY_DEFAULT);
    const to = recips.join(',');
    const subject = isRequest
      ? `Tool Request ${rec.id} — ${rec.name}`
      : `Non Vehicle Equipment Incident Report ${rec.id} — ${rec.status} — ${rec.name}`;
    const body = isRequest ?
`A new tool/equipment request has been submitted.

Request ID: ${rec.id}
Employee: ${rec.name}
Date: ${fmtDate(rec.date)}
Subdivision: ${rec.subdivision}
Location: ${rec.location}
Equipment requested: ${rec.equipment}
Supervisor: ${rec.supervisor}

Details:
${rec.summary}` :
`A new equipment incident report has been filed.

Report ID: ${rec.id}
Status: ${rec.status}
Employee: ${rec.name}
Date of incident: ${fmtDate(rec.date)}
Subdivision: ${rec.subdivision}
Location: ${rec.location}
Equipment: ${rec.equipment}
Supervisor: ${rec.supervisor}

Summary:
${rec.summary}

${repeatCount > 1 ? `NOTE: This is incident #${repeatCount} on record for this employee.` : ''}`;
    const mailto = `mailto:${recips.map(encodeURIComponent).join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    const emailLabel = isRequest ? 'Email request to M. Moore' : 'Notify supervisor & Moore';

    c.innerHTML = `
      <div class="card"><div class="card-body confirm">
        <div style="font-size:46px;line-height:1;color:var(--damaged);margin-bottom:8px">&#10003;</div>
        <div style="font-family:'Saira Condensed';font-size:24px;text-transform:uppercase;letter-spacing:.05em">${isRequest ? 'Request submitted' : 'Report submitted'}</div>
        <div class="tag">${rec.id}</div>
        ${repeatCount > 1 ? `<div style="margin-bottom:14px"><span class="repeat-flag">REPEAT &middot; ${repeatCount} on record for ${esc(rec.name)}</span></div>` : ''}
        <p style="color:var(--ink-soft);max-width:460px;margin:0 auto 22px">
          Saved to the log. Your email draft should open automatically with everyone filled in &mdash; just hit <strong>Send</strong>. If it doesn't open, use the button below.
        </p>
        <div class="actions" style="justify-content:center">
          <a class="btn btn-primary" id="emailLink" href="${mailto}" ${to ? '' : 'onclick="return false" style="opacity:.45;cursor:not-allowed"'}>${emailLabel}</a>
          <button class="btn btn-ghost" id="anotherBtn">File another</button>
        </div>
        ${to ? '' : '<div class="notice">No notification email was set, so the email button is disabled.</div>'}
      </div></div>`;
    c.querySelector('#anotherBtn').onclick = () => { view = 'file'; render(); };
    // Auto-open the pre-filled draft (best effort; the button is the fallback).
    if (to) { setTimeout(() => { try { window.location.href = mailto; } catch (e) {} }, 350); }
  }

  const normName = (n) => (n || '').trim().toLowerCase().replace(/\s+/g, ' ');

  // ---- METRICS ----
  function renderMetrics() {
    const c = document.getElementById('content');
    const total = reports.length;
    const byStatus = { Damaged: 0, Lost: 0, Stolen: 0, Request: 0 };
    reports.forEach(r => { if (byStatus[r.status] != null) byStatus[r.status]++; });
    const openCount = reports.filter(r => r.state !== 'closed').length;
    const closedCount = reports.filter(r => r.state === 'closed').length;

    // repeat issues by employee (incidents only — tool requests don't count)
    const byEmp = {};
    reports.forEach(r => {
      if (r.status === 'Request') return;
      const k = normName(r.name);
      if (!byEmp[k]) byEmp[k] = { name: r.name, count: 0, Damaged: 0, Lost: 0, Stolen: 0, last: r.date };
      byEmp[k].count++;
      if (byEmp[k][r.status] != null) byEmp[k][r.status]++;
      if (r.date > byEmp[k].last) byEmp[k].last = r.date;
    });
    const emps = Object.values(byEmp).sort((a, b) => b.count - a.count);
    const maxCount = emps.length ? emps[0].count : 1;
    const repeatCount = emps.filter(e => e.count > 1).length;

    // by subdivision & equipment
    const tally = (key) => {
      const m = {}; reports.forEach(r => { const v = r[key] || '—'; m[v] = (m[v] || 0) + 1; });
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    };
    const bySub = tally('subdivision');
    const byEquip = tally('equipment');

    c.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px;gap:12px;flex-wrap:wrap">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase">&#128275; Admin view &middot; signed in</div>
        <button class="link-btn" id="lockBtn">Sign out</button>
      </div>
      <div class="card" style="margin-top:14px"><div class="card-body">
        <div class="kpis">
          <div class="kpi"><div class="v">${total}</div><div class="k">Total</div></div>
          <div class="kpi open"><div class="v">${openCount}</div><div class="k">Open</div></div>
          <div class="kpi closed"><div class="v">${closedCount}</div><div class="k">Closed</div></div>
          <div class="kpi d"><div class="v">${byStatus.Damaged}</div><div class="k">Damaged</div></div>
          <div class="kpi l"><div class="v">${byStatus.Lost}</div><div class="k">Lost</div></div>
          <div class="kpi s"><div class="v">${byStatus.Stolen}</div><div class="k">Stolen</div></div>
          <div class="kpi rq"><div class="v">${byStatus.Request}</div><div class="k">Requests</div></div>
        </div>
      </div></div>

      <div class="card">
        <div class="card-head"><span class="num">M-01</span><h2>Repeat issues by employee</h2>
          ${repeatCount ? `<span class="repeat-flag" style="margin-left:auto">${repeatCount} repeat</span>` : ''}</div>
        <div class="card-body" style="padding-top:8px">
          ${emps.length ? `<table><thead><tr>
            <th>Employee</th><th style="width:38%">Reports</th><th>D / L / S</th><th>Last</th>
          </tr></thead><tbody>
          ${emps.map(e => `<tr>
            <td><strong>${esc(e.name)}</strong> ${e.count > 1 ? `<span class="repeat-flag">REPEAT &times;${e.count}</span>` : ''}</td>
            <td><div class="count-bar"><div class="bar" style="width:${Math.max(8, (e.count / maxCount) * 160)}px"></div><span style="font-family:'IBM Plex Mono'">${e.count}</span></div></td>
            <td style="font-family:'IBM Plex Mono';font-size:13px">${e.Damaged} / ${e.Lost} / ${e.Stolen}</td>
            <td class="meta">${fmtDate(e.last)}</td>
          </tr>`).join('')}
          </tbody></table>` : '<div class="empty">No reports yet. Repeat-issue tracking will populate as reports come in.</div>'}
        </div>
      </div>

      <div class="grid" style="margin-top:22px;gap:22px">
        <div class="card" style="margin-top:0">
          <div class="card-head"><span class="num">M-02</span><h2>By subdivision</h2></div>
          <div class="card-body" style="padding-top:8px">
            ${bySub.length ? `<table><tbody>${bySub.map(([k, v]) =>
              `<tr><td>${esc(k)}</td><td style="text-align:right;font-family:'IBM Plex Mono'">${v}</td></tr>`).join('')}</tbody></table>`
              : '<div class="empty">—</div>'}
          </div>
        </div>
        <div class="card" style="margin-top:0">
          <div class="card-head"><span class="num">M-03</span><h2>By equipment</h2></div>
          <div class="card-body" style="padding-top:8px">
            ${byEquip.length ? `<table><tbody>${byEquip.map(([k, v]) =>
              `<tr><td>${esc(k)}</td><td style="text-align:right;font-family:'IBM Plex Mono'">${v}</td></tr>`).join('')}</tbody></table>`
              : '<div class="empty">—</div>'}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="num">LOG</span><h2>All reports</h2>
          <button class="link-btn" id="exportBtn" style="margin-left:auto">Export CSV</button></div>
        <div class="card-body" style="padding-top:8px">
          ${total ? `<div class="toolbar">
            <input type="text" id="search" placeholder="Search name, location, equipment…" style="flex:1;min-width:200px">
            <select id="filterState"><option value="">Open &amp; Closed</option><option value="open">Open only</option><option value="closed">Closed only</option></select>
            <select id="filterStatus"><option value="">All statuses</option>${STATUSES.map(s => `<option>${s}</option>`).join('')}</select>
          </div>
          <table id="logTable"><thead><tr>
            <th>Photo</th><th>ID / Date</th><th>Employee</th><th>Status</th><th>State</th><th>Equipment</th><th>Subdivision</th><th>Location</th>
          </tr></thead><tbody id="logBody"></tbody></table>`
          : '<div class="empty">No reports filed yet.</div>'}
        </div>
      </div>`;

    c.querySelector('#lockBtn').onclick = async () => {
      await signOut();
      isAdmin = false; reports = []; view = 'file'; render();
    };

    if (total) {
      const search = c.querySelector('#search');
      const filterStatus = c.querySelector('#filterStatus');
      const filterState = c.querySelector('#filterState');
      const renderLog = () => {
        const q = (search.value || '').toLowerCase();
        const fs = filterStatus.value;
        const fst = filterState.value;
        const rows = reports.slice().reverse().filter(r => {
          const closed = r.state === 'closed';
          if (fst === 'open' && closed) return false;
          if (fst === 'closed' && !closed) return false;
          if (fs && r.status !== fs) return false;
          if (!q) return true;
          return [r.name, r.location, r.equipment, r.subdivision, r.supervisor, r.id]
            .some(v => (v || '').toLowerCase().includes(q));
        });
        c.querySelector('#logBody').innerHTML = rows.length ? rows.map(r => `
          <tr class="log-row" data-id="${r.id}" style="cursor:pointer">
            <td>${r.hasPhoto ? `<div class="log-thumb" data-img="${r.id}" style="background:#eee;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999">IMG</div>` : '<span class="meta">—</span>'}</td>
            <td><span style="font-family:'IBM Plex Mono';font-size:12px">${r.id}</span><div class="meta">${fmtDate(r.date)}</div></td>
            <td>${esc(r.name)}</td>
            <td><span class="pill ${r.status}">${r.status}</span></td>
            <td><span class="state-badge ${r.state === 'closed' ? 'closed' : 'open'}">${r.state === 'closed' ? 'CLOSED' : 'OPEN'}</span></td>
            <td>${esc(r.equipment)}</td>
            <td>${esc(r.subdivision)}</td>
            <td>${esc(r.location)}</td>
          </tr>`).join('') : '<tr><td colspan="8" class="empty">No matches.</td></tr>';
        c.querySelectorAll('.log-row').forEach(row => row.onclick = () => openDetail(row.dataset.id));
        // lazy-load thumbnails
        c.querySelectorAll('.log-thumb[data-img]').forEach(async el => {
          const d = await loadImage(el.dataset.img);
          if (d) { el.outerHTML = `<img class="log-thumb" src="${d}" data-open="${el.dataset.img}">`; }
        });
      };
      search.oninput = renderLog;
      filterStatus.onchange = renderLog;
      filterState.onchange = renderLog;
      renderLog();
      c.querySelector('#exportBtn').onclick = exportCSV;
    }
  }

  async function openDetail(id) {
    const r = reports.find(x => x.id === id);
    if (!r) return;
    const repeat = reports.filter(x => normName(x.name) === normName(r.name)).length;
    const img = r.hasPhoto ? await loadImage(id) : null;
    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <div class="card-head"><span class="num">${r.id}</span><h2>${esc(r.name)}</h2>
        <button class="link-btn" style="margin-left:auto" id="closeModal">Close</button></div>
      <div class="card-body">
        ${repeat > 1 ? `<div style="margin-bottom:12px"><span class="repeat-flag">REPEAT &middot; ${repeat} reports on record</span></div>` : ''}
        <div style="margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="pill ${r.status}">${r.status}</span>
          <span class="state-badge ${r.state === 'closed' ? 'closed' : 'open'}">${r.state === 'closed' ? 'CLOSED' : 'OPEN'}</span>
        </div>
        <div class="dl-row"><span class="k">Date of incident</span><span class="v">${fmtDate(r.date)}</span></div>
        <div class="dl-row"><span class="k">Subdivision</span><span class="v">${esc(r.subdivision)}</span></div>
        <div class="dl-row"><span class="k">Location</span><span class="v">${esc(r.location)}</span></div>
        <div class="dl-row"><span class="k">Equipment</span><span class="v">${esc(r.equipment)}</span></div>
        <div class="dl-row"><span class="k">Supervisor</span><span class="v">${esc(r.supervisor)}${r.supervisorEmail ? ' · ' + esc(r.supervisorEmail) : ''}</span></div>
        <div class="dl-row"><span class="k">Summary of events</span><span class="v" style="white-space:pre-wrap">${esc(r.summary)}</span></div>
        ${r.state === 'closed' && r.closedAt ? `<div class="dl-row"><span class="k">Closed</span><span class="v">${fmtDate((r.closedAt || '').slice(0,10))}</span></div>` : ''}
        ${img ? `<img src="${img}" style="margin-top:12px">` : ''}
        <div class="field" style="margin-top:16px">
          <label for="noteBox">Notes / resolution</label>
          <textarea id="noteBox" style="min-height:80px">${esc(r.note || '')}</textarea>
          <div id="noteSaved" class="err-text" style="display:none;color:var(--damaged)">Saved.</div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:10px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="deleteReport" style="color:var(--stolen);border-color:var(--stolen)">Delete report</button>
          <div style="display:flex;gap:10px">
            <button class="btn btn-ghost" id="saveNote">Save note</button>
            ${r.state === 'closed'
              ? '<button class="btn btn-ghost" id="toggleState">Reopen</button>'
              : '<button class="btn btn-primary" id="toggleState">Close report</button>'}
          </div>
        </div>
      </div>`;
    document.getElementById('modalBg').style.display = 'flex';
    document.getElementById('closeModal').onclick = closeModal;

    const noteBox = document.getElementById('noteBox');
    const persist = async (changes, btn, busyText) => {
      const updated = Object.assign({}, r, { note: noteBox.value }, changes || {});
      if (btn) { btn.disabled = true; btn.dataset.txt = btn.textContent; btn.textContent = busyText; }
      try {
        await updateReport(r.dbId, updated);
        const idx = reports.findIndex(x => x.id === id);
        if (idx > -1) reports[idx] = updated;
        return true;
      } catch (e) {
        console.error(e);
        if (btn) { btn.disabled = false; btn.textContent = btn.dataset.txt; }
        alert("Couldn't save — the database didn't respond. Check your connection and try again.");
        return false;
      }
    };
    document.getElementById('saveNote').onclick = async (e) => {
      if (await persist({}, e.target, 'Saving…')) {
        const n = document.getElementById('noteSaved'); n.style.display = 'block';
        e.target.disabled = false; e.target.textContent = 'Save note';
      }
    };
    document.getElementById('toggleState').onclick = async (e) => {
      const closing = r.state !== 'closed';
      const changes = closing ? { state: 'closed', closedAt: new Date().toISOString() } : { state: 'open', closedAt: null };
      if (await persist(changes, e.target, closing ? 'Closing…' : 'Reopening…')) { closeModal(); renderMetrics(); }
    };

    const delBtn = document.getElementById('deleteReport');
    delBtn.onclick = async () => {
      if (!confirm("Delete this report permanently? It will be removed from the shared log for everyone, and this can't be undone.")) return;
      delBtn.disabled = true; delBtn.textContent = 'Deleting…';
      try {
        await deleteReport(r.dbId);
        const idx = reports.findIndex(x => x.id === id);
        if (idx > -1) reports.splice(idx, 1);
        closeModal();
        renderMetrics();
      } catch (e) {
        console.error(e);
        delBtn.disabled = false; delBtn.textContent = 'Delete report';
        alert("Couldn't delete that report — the database didn't respond. Check your connection and try again.");
      }
    };
  }
  function closeModal() { document.getElementById('modalBg').style.display = 'none'; }

  function exportCSV() {
    const cols = ['id','submittedAt','status','state','closedAt','name','date','subdivision','location','equipment','supervisor','supervisorEmail','summary','note'];
    const head = ['Report ID','Submitted','Status','State','Closed','Employee','Incident Date','Subdivision','Location','Equipment','Supervisor','Supervisor Email','Summary','Notes'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = reports.map(r => cols.map(c => q(r[c])).join(','));
    const csv = head.map(q).join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'equipment_incident_reports.csv';
    a.click();
  }

  // ---- init ----
  app.innerHTML = '<div class="loading">Loading…</div>';
  (async () => {
    await checkSession();
    if (isAdmin) await loadReports(); // returns nothing for anonymous filers (RLS)
    render();
  })();
})();
</script>
</body>
</html>
